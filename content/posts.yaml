# Content bank. Posts are published in order, per market, by the scheduler.
# Add, edit or reorder freely. Fields:
#   id        unique, never reuse            market   us | br
#   command   the fake terminal line on top  headline big text on the card
#   sub       smaller line under headline    bullets  up to 4 short items
#   caption   Instagram caption ({cta}, {email}, {website}, {whatsapp} are filled in)
#   hashtags  appended to the caption        alt      accessibility text
#   style     "statement" (default) | "list" | "stat"

# ═══════════════════════════════ USA (EN) ═══════════════════════════════
- id: us-001-intro
  market: us
  style: list
  command: "whoami"
  headline: "Offensive security, done by a practitioner."
  sub: "Penetration testing for US companies"
  bullets: ["Web & API pentests", "External & internal network", "Active Directory attack paths", "Clear, actionable reports"]
  caption: |
    Attackers don't run checklists. Neither do we.

    We're an offensive security team led by an OSCP+ certified penetration tester with years of hands-on red team work and published labs on OffSec Proving Grounds.

    We test your web apps, APIs, networks and Active Directory the way a real attacker would, then hand you a report your developers can actually act on.

    {cta}
  hashtags: "#pentest #penetrationtesting #cybersecurity #offensivesecurity #infosec #redteam #OSCP #smallbusiness"
  alt: "Dark terminal-style card reading: Offensive security, done by a practitioner. Services: web and API pentests, network, Active Directory, actionable reports."

- id: us-002-scanner
  market: us
  style: statement
  command: "nmap -sV --script vuln client.com"
  headline: "A vulnerability scan is not a pentest."
  sub: "Scanners find known issues. Humans find the chain that breaks you."
  caption: |
    Automated scanners are useful. But they can't:
    → chain three "low" findings into full domain compromise
    → abuse your business logic (pricing, roles, approvals)
    → think like someone who actually wants in

    A manual penetration test shows you what an attacker can really reach, and how to stop them.

    {cta}
  hashtags: "#pentest #vulnerabilityassessment #appsec #cybersecurity #infosec #ethicalhacking"
  alt: "Card reading: A vulnerability scan is not a pentest."

- id: us-003-compliance
  market: us
  style: list
  command: "cat ./compliance_requirements.txt"
  headline: "Need a pentest for compliance?"
  sub: "Evidence-ready reports for your auditors"
  bullets: ["SOC 2", "PCI DSS", "HIPAA", "ISO 27001"]
  caption: |
    SOC 2, PCI DSS, HIPAA and ISO 27001 audits often expect regular penetration testing.

    We deliver:
    ✔ Executive summary for leadership and auditors
    ✔ Technical findings with risk ratings and reproduction steps
    ✔ Remediation guidance your team can follow
    ✔ Retest of fixed findings included

    {cta}
  hashtags: "#SOC2 #PCIDSS #HIPAA #ISO27001 #compliance #pentest #cybersecurity #startups"
  alt: "Card reading: Need a pentest for compliance? SOC 2, PCI DSS, HIPAA, ISO 27001."

- id: us-004-ad
  market: us
  style: statement
  command: "bloodhound-python -c All -d corp.local"
  headline: "One phished user. How far can they go?"
  sub: "Internal & Active Directory penetration testing"
  caption: |
    In many internal assessments, the path from a single low-privileged account to Domain Admin is shorter than anyone expected.

    Our internal / Active Directory pentest maps those attack paths (Kerberoasting, ADCS misconfigurations, delegation abuse, weak ACLs) and shows you exactly which links to break first.

    {cta}
  hashtags: "#activedirectory #redteam #pentest #bloodhound #ADCS #cybersecurity #infosec"
  alt: "Card reading: One phished user. How far can they go? Internal and Active Directory penetration testing."

- id: us-005-api
