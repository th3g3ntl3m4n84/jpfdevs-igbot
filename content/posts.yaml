  style: list
  command: "curl -X GET /api/v1/users/1337"
  headline: "Your API is your new perimeter."
  sub: "What we test in an API pentest"
  bullets: ["Broken object-level auth (BOLA/IDOR)", "Auth & token handling", "Mass assignment", "Rate limiting & business logic"]
