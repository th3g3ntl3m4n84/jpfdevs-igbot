name: Refresh Instagram token

# Long-lived Instagram tokens expire after 60 days. This refreshes it weekly
# and writes the new value back into the IG_ACCESS_TOKEN secret.
# Requires a secret GH_PAT: a fine-grained personal access token with
# "Secrets: Read and write" permission on this repository only.

on:
  schedule:
    - cron: "17 6 * * 0"   # Sundays 06:17 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh and store
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python -m bot refresh-token)
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
          echo "Token refreshed and saved."
