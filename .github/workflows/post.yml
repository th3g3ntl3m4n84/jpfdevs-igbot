name: Instagram auto-post

on:
  schedule:
    # Cron is UTC. Adjust freely.
    # USA (EN): Tue & Thu 14:00 UTC  = 9:00 AM New York (EST) / 10:00 AM (EDT)
    - cron: "0 14 * * 2,4"
    # Brasil (PT): Mon, Wed & Fri 22:00 UTC = 19:00 Brasília / 18:00 Campo Grande
    - cron: "0 22 * * 1,3,5"
  workflow_dispatch:
    inputs:
      market:
        description: "Market to post for"
        type: choice
        options: [us, br]
        default: br
      post_id:
        description: "Optional: specific post id from content/posts.yaml"
        required: false
      dry_run:
        description: "Render only, do not publish"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide market
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "market=${{ inputs.market }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 14 * * 2,4" ]; then
            echo "market=us" >> "$GITHUB_OUTPUT"
          else
            echo "market=br" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        run: |
          git config user.name  "jpfdevs-bot"
          git config user.email "jpfdevs-bot@users.noreply.github.com"

      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_HOSTING: github
        run: |
          ARGS="--market ${{ steps.m.outputs.market }}"
          if [ -n "${{ inputs.post_id }}" ]; then ARGS="--id ${{ inputs.post_id }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m bot post $ARGS

      - name: Save posting history
        if: ${{ inputs.dry_run != true }}
        run: |
          git add state/posted.json || true
          git diff --cached --quiet || (git commit -m "state: posted via ${{ steps.m.outputs.market }}" && git push)
